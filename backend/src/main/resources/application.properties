# CivicAI Spring Boot Application Configuration

spring.application.name=CivicAI-Backend
server.port=${SERVER_PORT:8080}

# MySQL Database Configuration (overridable via .env or environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/civicai_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# File Upload Configuration (10MB per file, 25MB total request)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# JWT Configuration
civicai.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
civicai.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
civicai.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Storage Configuration
civicai.upload.dir=${UPLOAD_DIR:../uploads}

# Python AI Service Integration URL
civicai.ai-service.url=${AI_SERVICE_URL:http://localhost:8000}

# Logging Configuration
logging.level.com.civicai=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
