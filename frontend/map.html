<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Map – CivicAI</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    .map-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
      background: white;
      padding: 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar"></aside>

    <div class="main-wrapper">
      <header class="topbar">
        <h1 class="page-title">Interactive City Infrastructure Map</h1>
        <div class="topbar-actions">
          <button class="btn btn-secondary btn-sm" onclick="loadMapIncidents()">🔄 Refresh Markers</button>
        </div>
      </header>

      <main class="content-body">
        <!-- Map Filters -->
        <div class="map-controls">
          <div>
            <label style="font-size: 0.8rem; font-weight: 600;">Category:</label>
            <select id="map-category" class="form-control" style="width: 180px; display: inline-block; margin-left: 0.5rem;" onchange="filterMarkers()">
              <option value="">All Categories</option>
              <option value="POTHOLE">Pothole</option>
              <option value="ROAD_CRACK">Road Crack</option>
              <option value="STREETLIGHT_DAMAGE">Streetlight Damage</option>
              <option value="WATER_LEAKAGE">Water Leakage</option>
              <option value="GARBAGE_OVERFLOW">Garbage Overflow</option>
            </select>
          </div>

          <div>
            <label style="font-size: 0.8rem; font-weight: 600;">Priority:</label>
            <select id="map-priority" class="form-control" style="width: 160px; display: inline-block; margin-left: 0.5rem;" onchange="filterMarkers()">
              <option value="">All Priorities</option>
              <option value="CRITICAL">Critical (Red)</option>
              <option value="HIGH">High (Orange)</option>
              <option value="MEDIUM">Medium (Yellow)</option>
              <option value="LOW">Low (Green)</option>
            </select>
          </div>

          <div style="margin-left: auto; display: flex; gap: 0.75rem; font-size: 0.8rem; align-items: center;">
            <span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#ef4444;margin-right:4px;"></span> Critical</span>
            <span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#f97316;margin-right:4px;"></span> High</span>
            <span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#f59e0b;margin-right:4px;"></span> Medium</span>
            <span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#10b981;margin-right:4px;"></span> Low</span>
          </div>
        </div>

        <div id="map"></div>
      </main>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    Auth.requireAuth();
    UI.renderSidebar("map");

    let map = null;
    let markersLayer = null;
    let allIncidents = [];

    function initMap() {
      // Default center around municipal area (San Francisco or first report coords)
      map = L.map('map').setView([37.7749, -122.4194], 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);
    }

    function getPriorityColor(priority) {
      switch ((priority || "MEDIUM").toUpperCase()) {
        case "CRITICAL": return "#ef4444";
        case "HIGH": return "#f97316";
        case "MEDIUM": return "#f59e0b";
        case "LOW": return "#10b981";
        default: return "#0284c7";
      }
    }

    async function loadMapIncidents() {
      try {
        const res = await Api.get("/incidents?size=100");
        if (res.success && res.data) {
          allIncidents = res.data.content || [];
          renderMarkers(allIncidents);
        }
      } catch (err) {
        UI.showToast("Failed to fetch map points: " + err.message, "error");
      }
    }

    function renderMarkers(incidents) {
      markersLayer.clearLayers();

      const bounds = [];
      incidents.forEach(inc => {
        if (inc.latitude && inc.longitude) {
          const lat = parseFloat(inc.latitude);
          const lon = parseFloat(inc.longitude);
          bounds.push([lat, lon]);

          const color = getPriorityColor(inc.approvedPriority);

          const marker = L.circleMarker([lat, lon], {
            radius: 9,
            fillColor: color,
            color: "#ffffff",
            weight: 2,
            opacity: 1,
            fillOpacity: 0.9
          });

          const popupContent = `
            <div style="min-width: 180px; font-family: sans-serif;">
              <h4 style="margin: 0 0 4px; font-size: 0.95rem;">${UI.escapeHtml(inc.category.replace('_', ' '))}</h4>
              <div style="font-size: 0.8rem; color: #64748b; margin-bottom: 4px;">Ref: <strong>${UI.escapeHtml(inc.referenceNumber)}</strong></div>
              <div style="font-size: 0.8rem; margin-bottom: 4px;">Priority: <strong>${UI.escapeHtml(inc.approvedPriority)}</strong></div>
              <div style="font-size: 0.8rem; margin-bottom: 8px;">Status: <strong>${UI.escapeHtml(inc.status)}</strong></div>
              <a href="incident-details.html?id=${inc.id}" style="display: block; text-align: center; background: #0284c7; color: white; padding: 4px 8px; border-radius: 4px; text-decoration: none; font-size: 0.8rem; font-weight: 600;">View Incident</a>
            </div>
          `;

          marker.bindPopup(popupContent);
          markersLayer.addLayer(marker);
        }
      });

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
      }
    }

    function filterMarkers() {
      const cat = document.getElementById("map-category").value;
      const prio = document.getElementById("map-priority").value;

      let filtered = allIncidents;
      if (cat) {
        filtered = filtered.filter(i => i.category === cat);
      }
      if (prio) {
        filtered = filtered.filter(i => (i.approvedPriority || "MEDIUM").toUpperCase() === prio);
      }
      renderMarkers(filtered);
    }

    initMap();
    loadMapIncidents();
  </script>
</body>
</html>
